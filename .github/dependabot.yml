version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/bench_runner/templates"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 14

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      pip:
        patterns: ["*"]
        exclude-patterns: ["pyperf"]
    cooldown:
      default-days: 14
